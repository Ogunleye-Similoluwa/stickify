services:
  - type: web
    name: stickify-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    # Only redeploy when the server changes, not on website-only pushes.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      # Only our own sites (GitHub Pages, Netlify, Cloudflare Pages) may call the API from a browser.
      - key: ALLOWED_ORIGINS
        value: "https://ogunleye-similoluwa.github.io,https://stickify-wa.netlify.app,https://stickify-wa.pages.dev"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      # Stickify WhatsApp number. Secrets are set in the Render dashboard, never in this file.
      # "linked" = a normal WhatsApp number linked like WhatsApp Web; "cloud" = Meta's Cloud API.
      - key: WHATSAPP_MODE
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: RATE_LIMIT_REQUESTS
        value: "30"
