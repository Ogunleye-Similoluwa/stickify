name: Feature request
description: Suggest an idea for Stickify
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or use case.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How do you imagine it working?
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
