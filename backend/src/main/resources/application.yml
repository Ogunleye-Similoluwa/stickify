server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: stickify-api
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

stickify:
  ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  max-concurrent-jobs: ${MAX_CONCURRENT_JOBS:2}
  # Comma-separated list of sites allowed to call the API, e.g. https://you.github.io
  allowed-origins: ${ALLOWED_ORIGINS:*}
  rate-limit-requests: ${RATE_LIMIT_REQUESTS:30}
  rate-limit-window: 10m

logging:
  level:
    com.stickify: INFO

# Stickify WhatsApp number (off until WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID and WHATSAPP_NUMBER are set)
whatsapp:
  # cloud = Meta's WhatsApp Cloud API; linked = a normal number linked like WhatsApp Web (see backend/bridge)
  mode: ${WHATSAPP_MODE:cloud}
  bridge-secret: ${BRIDGE_SECRET:}
  token: ${WHATSAPP_TOKEN:}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  number: ${WHATSAPP_NUMBER:}
  verify-token: ${WHATSAPP_VERIFY_TOKEN:}
  app-secret: ${WHATSAPP_APP_SECRET:}
  business-account-id: ${WHATSAPP_BUSINESS_ACCOUNT_ID:}
  graph-base-url: ${WHATSAPP_GRAPH_URL:https://graph.facebook.com/v25.0}
